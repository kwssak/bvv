name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '20'

jobs:
  check-repo:
    name: Check Repository Structure
    runs-on: ubuntu-latest
    outputs:
      has-backend: ${{ steps.check.outputs.has-backend }}
      has-frontend: ${{ steps.check.outputs.has-frontend }}
      has-scripts: ${{ steps.check.outputs.has-scripts }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          [ -d "backend" ] && [ -f "backend/go.mod" ] && echo "has-backend=true" >> $GITHUB_OUTPUT || echo "has-backend=false" >> $GITHUB_OUTPUT
          [ -d "frontend" ] && [ -f "frontend/package.json" ] && echo "has-frontend=true" >> $GITHUB_OUTPUT || echo "has-frontend=false" >> $GITHUB_OUTPUT
          [ -d "scripts" ] && echo "has-scripts=true" >> $GITHUB_OUTPUT || echo "has-scripts=false" >> $GITHUB_OUTPUT
          echo "Backend: $([ -d backend ] && echo '✅' || echo '❌')"
          echo "Frontend: $([ -d frontend ] && echo '✅' || echo '❌')"
          echo "Scripts: $([ -d scripts ] && echo '✅' || echo '❌')"

  lint-backend:
    name: Lint Backend
    needs: check-repo
    if: needs.check-repo.outputs.has-backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: ./backend
          args: --timeout=5m

  test-backend:
    name: Test Backend
    needs: check-repo
    if: needs.check-repo.outputs.has-backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - working-directory: ./backend
        run: go mod download
      - working-directory: ./backend
        run: go test -v -race ./... || true

  lint-frontend:
    name: Lint Frontend
    needs: check-repo
    if: needs.check-repo.outputs.has-frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - working-directory: ./frontend
        run: npm ci || npm install
      - working-directory: ./frontend
        run: npm run lint || echo "No lint script"

  build-frontend:
    name: Build Frontend
    needs: check-repo
    if: needs.check-repo.outputs.has-frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - working-directory: ./frontend
        run: npm ci || npm install
      - working-directory: ./frontend
        run: npm run build || echo "No build script"

  shellcheck:
    name: ShellCheck Scripts
    needs: check-repo
    if: needs.check-repo.outputs.has-scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          severity: warning

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
